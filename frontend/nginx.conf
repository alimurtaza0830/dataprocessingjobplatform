server {
    listen 80;
    listen [::]:80;
    server_name _;
    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html;

    # Simple container health check
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    # Docker's embedded DNS. Re-resolve service names so a recreated
    # backend container (new IP) is picked up without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Forward frontend API requests to FastAPI.
    # /api/jobs becomes /jobs inside the backend.
    location /api/ {
        set $backend_upstream http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React single-page application fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
